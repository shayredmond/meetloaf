name: Build & Release

on:
  # Build every platform on every PR. Windows regressions used to surface only
  # when someone cut a tag, which is the worst place to find them.
  pull_request:
  push:
    # Merges land code no PR ever built: a conflict resolution is written at
    # merge time and goes straight to main. Without this, the first build of
    # such a merge would be the release build.
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Read-only by default; only the release job needs to write, and it asks for
# that itself. (The v0.1.0 upload failure was the default read-only token.)
permissions:
  contents: read

# One run per ref. PR runs supersede each other, but a tag build is never
# cancelled — that's a release in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing shouldn't deny you the other's artifact.
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS (arm64 DMG)
            build: npm run dist
            artifact: MeetLoaf-macos
            path: app/dist/*.dmg
          - os: windows-latest
            name: Windows (x64 + arm64 installers)
            build: npm run dist:win
            artifact: MeetLoaf-windows
            # latest.yml is not optional: it's the metadata electron-updater
            # reads to discover versions, so a release without it silently
            # never updates anyone.
            #
            # NSIS also writes its uninstaller stubs into dist/ alongside the
            # real installers. Without the exclusion they ride along into the
            # release, where MeetLoaf-Setup-x64.__uninstaller.exe sitting next
            # to MeetLoaf-Setup-x64.exe is an invitation to run the wrong one.
            path: |
              app/dist/*.exe
              app/dist/latest.yml
              !app/dist/*__uninstaller*.exe
          # Built on the oldest supported LTS: binaries link against its glibc,
          # so a 22.04 build runs on 22.04 and 24.04, but not the reverse.
          - os: ubuntu-22.04
            name: Linux (x64 deb + AppImage)
            build: npm run dist:linux
            artifact: MeetLoaf-linux
            # latest-linux.yml is the AppImage's update metadata, the
            # counterpart of latest.yml above.
            path: |
              app/dist/*.deb
              app/dist/*.AppImage
              app/dist/latest-linux.yml
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      # macOS rasterises icon.svg with rsvg-convert; Windows and Linux use the
      # @resvg/resvg-js devDependency and need nothing from the system.
      - name: Install librsvg
        if: runner.os == 'macOS'
        run: brew install librsvg

      - name: Install dependencies
        run: npm ci

      # Each build script generates its own icons first, so there's no
      # separate icon step. Windows installers are unsigned: SmartScreen shows
      # "Windows protected your PC" (More info → Run anyway), the counterpart
      # of the macOS quarantine prompt. Set CSC_LINK / CSC_KEY_PASSWORD to
      # remove it if a signing cert ever lands.
      - name: Build
        run: ${{ matrix.build }}

      # Always artifacts, never a release. Publishing is the release job's
      # job alone, so the two platforms can't race to create the same release.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # The in-app update checker compares the release's tag against
      # app.getVersion(). Tagging v0.1.8 while package.json still says 0.1.7
      # would prompt every user to "upgrade" to a build reporting the version
      # they already run — permanently, since the prompt never stops being
      # true. Cheaper to refuse the release than to yank it afterwards.
      - name: Tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./app/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match app/package.json version $PKG"
            exit 1
          fi
          echo "Tag and package.json agree on $PKG"

      - name: Collect every platform's artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Published as a DRAFT on purpose. The tag builds everything and
      # assembles the release, but nothing is public until you press Publish
      # in the GitHub UI — so you can download the DMG and the installers and
      # try them first. It also keeps users quiet until then: the update
      # checker reads /releases/latest, which excludes drafts.
      - name: Assemble draft release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
          draft: true
          # An empty release is worse than a failed one.
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
