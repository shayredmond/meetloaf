name: Build & Release

on:
  # Build both platforms on every PR. Windows regressions used to surface only
  # when someone cut a tag, which is the worst place to find them.
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Read-only by default; only the release job needs to write, and it asks for
# that itself. (The v0.1.0 upload failure was the default read-only token.)
permissions:
  contents: read

# One run per ref. PR runs supersede each other, but a tag build is never
# cancelled — that's a release in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing shouldn't deny you the other's artifact.
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS (arm64 DMG)
            build: npm run dist
            artifact: MeetLoaf-macos
            path: app/dist/*.dmg
          - os: windows-latest
            name: Windows (x64 + arm64 installers)
            build: npm run dist:win
            artifact: MeetLoaf-windows
            path: app/dist/*.exe
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      # macOS rasterises icon.svg with rsvg-convert; Windows uses the
      # @resvg/resvg-js devDependency and needs nothing from the system.
      - name: Install librsvg
        if: runner.os == 'macOS'
        run: brew install librsvg

      - name: Install dependencies
        run: npm ci

      # Each build script generates its own icons first, so there's no
      # separate icon step. Windows installers are unsigned: SmartScreen shows
      # "Windows protected your PC" (More info → Run anyway), the counterpart
      # of the macOS quarantine prompt. Set CSC_LINK / CSC_KEY_PASSWORD to
      # remove it if a signing cert ever lands.
      - name: Build
        run: ${{ matrix.build }}

      # Always artifacts, never a release. Publishing is the release job's
      # job alone, so the two platforms can't race to create the same release.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Collect every platform's artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
