<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Opening in MeetLoaf…</title>
  <link rel="stylesheet" href="handoff.css">
</head>
<body>
  <main>
    <h1 id="title">Opening in MeetLoaf…</h1>
    <p id="code" class="code"></p>

    <div id="firstRun" hidden>
      <p>Your browser will ask to open <strong>MeetLoaf</strong>. Tick <strong>Always allow</strong> and click <strong>Open</strong>.</p>
      <p class="muted">After that, Meet links go straight to MeetLoaf and this tab tidies itself away.</p>
      <button id="done" class="primary">Done</button>
    </div>

    <p id="closing" class="muted" hidden>This tab will close in a moment.</p>
    <p id="invalid" hidden>That doesn't look like a Meet link.</p>

    <div class="actions">
      <button id="retry">Open MeetLoaf again</button>
      <button id="inBrowser">Join in the browser instead</button>
    </div>
  </main>
  <script src="handoff.js"></script>
</body>
</html>
