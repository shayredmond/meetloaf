<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'self'">
  <title>Share your screen</title>
  <link rel="stylesheet" href="picker.css">
</head>
<body>
  <header>
    <h1>Choose what to share</h1>
    <div class="tabs" role="tablist">
      <button class="tab active" data-kind="screen" role="tab">Entire screen</button>
      <button class="tab" data-kind="window" role="tab">Window</button>
    </div>
  </header>

  <main id="grid" role="listbox" aria-label="Sources"></main>

  <footer>
    <label id="audioRow" hidden>
      <input type="checkbox" id="audio"> Also share system audio
    </label>
    <div class="actions">
      <button id="cancel">Cancel</button>
      <button id="share" class="primary" disabled>Share</button>
    </div>
  </footer>

  <script src="picker.js"></script>
</body>
</html>
